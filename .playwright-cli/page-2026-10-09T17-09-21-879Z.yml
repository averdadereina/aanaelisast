                    - button "Show translation" [ref=e100] [cursor=pointer]
                  - generic [ref=e101]: "*NOTA DA EQUIPE JURÍDICA* Na manhã de 5 de setembro de 2026, Ana Elisa recebeu por e-mail ameaças racistas de morte e de estupro. O autor se apresenta como integrante de um grupo supremacista branco, menciona dados pessoais da candidata para demonstrar que sabe como localizá-la e ameaça também sua família. Isso não é debate político, é crime. O conteúdo apresenta indícios de ameaça, racismo e violência política contra a mulher, prevista na legislação eleitoral quando a agressão busca impedir ou restringir a participação política de uma mulher em razão de seu gênero, inclusive associada à violência racial. As providências policiais e judiciais cabíveis já foram adotadas, inclusive para identificação da autoria. Os detalhes serão preservados para não prejudicar a apuração. A internet não é território de impunidade. Registros técnicos podem permitir a identificação de quem utiliza o anonimato para ameaçar, perseguir ou intimidar. Esta candidatura não aceitará que racismo, ameaça, violência sexual ou violência política de gênero sejam tratados como parte normal da vida pública. A tentativa de intimidar uma mulher negra para afastá-la da disputa política será respondida com denúncia, investigação e responsabilização e campanha eleitoral na rua. Por razões de segurança, a campanha não divulgará a íntegra das mensagens nem identificará publicamente o grupo mencionado pelo autor. Também pede que apoiadores e demais pessoas que tenham tido acesso ao material **não o reproduzam nem façam circular**. O conteúdo recebido foi levado às autoridades como notícia de crimes e será tratado dessa forma até o fim da apuração. Às demais candidatas que tenham recebido ameaças semelhantes, esta equipe jurídica se coloca à disposição para troca de informações. Ameaçar uma mulher para tentar fazê-la desistir de uma eleição é crime contra ela e contra o direito de quem quer votar nela. Aqui não admitiremos. *Equipe jurídica da campanha de Ana Elisa* Maria Júlia A. Alvim OAB/MG 240.536"
